name: Deploy website to GitHub Pages / 部署网站

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build / 构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v7

      - name: Build and upload Pages artifact / 构建并上传 Pages 产物
        uses: withastro/action@v6
        with:
          path: ./website
          package-manager: bun@1.3.8

  deploy:
    name: Deploy / 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages / 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
